[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grand-design-ai"
version = "0.1.0"
description = "Evaluation-first foundation for The Wandering Inn to Pathfinder 2e conversions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
grand-design = "grand_design.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
